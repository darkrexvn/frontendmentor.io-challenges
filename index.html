<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Card</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="card">
        <img class="card-top" src="bg-pattern-card.svg">
        <img class="avatar" src="image-victor.jpg">
        <div class="info">
            <h1>Victor Crest <span>26</span></h1>
            <p>London</p>
        </div>
        <div class="line"></div>
        <div class="stats">
            <div class="item">
                <h2>80K</h2>
                <p>Followers</p>
            </div>
            <div class="item">
                <h2>803K</h2>
                <p>Likes</p>
            </div>
            <div class="item">
                <h2>1.4K</h2>
                <p>Photos</p>
            </div>
        </div>
    </div>
    <div class="background">
        <img src="bg-pattern-bottom.svg" alt="bottom background" id="bot">
        <img src="bg-pattern-top.svg" alt="top background" id="top">
    </div>
</body>
</html>
